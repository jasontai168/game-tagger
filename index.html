<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比賽標記器 · Game Tagger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18212b; --deep:#111a24; --panel:#212d3a; --panel2:#2a3a4c; --line:#37495e;
  --text:#e8ecf0; --muted:#98a8ba; --wood:#e3a857; --made:#62c08f; --miss:#ea7c6c; --info:#7fb2e0;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none !important}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Public Sans','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif}
.num,.big,th,.tm,.mini b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
input,textarea{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:100%}
.app{max-width:1400px;margin:0 auto;padding:14px 16px 40px}

.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .l,.top .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top h1{margin:0 8px 0 0;font:600 26px 'Barlow Condensed',sans-serif;letter-spacing:.02em;color:var(--wood)}
.primary{background:var(--wood);border-color:var(--wood);color:#1d1608;font-weight:600}
.primary:hover{border-color:#fff}
.langsw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0}
.langsw button{border:0;border-radius:0;padding:6px 10px;background:var(--panel2)}
.langsw button.on{background:var(--wood);color:#1d1608;font-weight:600}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.stage{min-width:0}
.vwrap{position:relative;background:var(--deep);border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.vwrap video,.vwrap #ytwrap{width:100%;height:100%;display:block;background:#000}
.vwrap #ytwrap iframe{width:100%;height:100%;display:block}
.vempty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted)}
.vempty.hide{display:none}

.srcsw{display:flex;gap:6px;margin:0 0 8px}
.srcsw button{padding:4px 12px;font-size:13px}
.srcsw button.on{background:var(--wood);border-color:var(--wood);color:#1d1608;font-weight:600}
.plform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.plform input{flex:1;min-width:180px}
.chapbox{white-space:pre-wrap;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;max-height:50vh;overflow-y:auto;background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:10px}

.vtools{display:flex;gap:8px;justify-content:flex-end;margin:8px 0 0}
.vtools button{padding:3px 12px;font-size:13px}
.theater .grid{grid-template-columns:1fr}
.theater .vwrap{aspect-ratio:auto;height:min(80vh,56vw)}
.segs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.segs button{padding:3px 10px;font-size:13px}
.segs button.on{background:var(--wood);border-color:var(--wood);color:#1d1608}
.segs button.missing{opacity:.55;border-style:dashed}
.segs small{margin-left:6px;opacity:.75}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
.buf{min-width:150px;display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 14px}
.buf .big{font-size:38px;font-weight:700;line-height:1.1;color:var(--wood)}
.buf small{color:var(--muted)}
.bufname{font-size:18px;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bufname small{font-weight:400;margin-left:6px}
.bufname.on{color:var(--made)} .bufname.off{color:var(--miss)}
.toast{flex:1;min-width:160px;font-weight:500;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
.toast.made{color:var(--made)} .toast.miss,.toast.bad,.toast.warn{color:var(--miss)} .toast.neutral{color:var(--info)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{border-radius:999px;padding:2px 12px;font-weight:600;background:var(--miss);color:#2a0d08}
.court{border-radius:999px;padding:2px 12px;font-weight:600}
.court.ok{border:1px solid var(--made);color:var(--made)}
.court.bad{background:var(--miss);color:#2a0d08}
.badge.end{background:var(--info);color:#0b2136}
.delay{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.delay select{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;color:var(--text)}
.speed button{padding:3px 9px}
.speed button.on{background:var(--wood);border-color:var(--wood);color:#1d1608}

.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.keys button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 10px}
.keys kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:5px;background:var(--deep);border:1px solid var(--line);font:600 14px 'Barlow Condensed',sans-serif}
.keys .made{border-left:4px solid var(--made)} .keys .miss{border-left:4px solid var(--miss)}
.keys .neutral{border-left:4px solid var(--info)} .keys .bad{border-left:4px solid var(--miss)}
.keys .ctl{border-left:4px solid var(--line)}
.help{color:var(--muted);font-size:13px;margin:10px 0 0}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.pl{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:8px;align-items:center;padding:5px 8px;border-left:3px solid transparent;border-radius:4px;cursor:pointer}
.pl:hover{background:var(--panel2)}
.pl.on{border-left-color:var(--wood);background:var(--panel2)}
.pl.sel{outline:2px solid var(--wood)}
.pl .num{font-size:24px;font-weight:600;color:var(--wood);text-align:right}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{text-align:right;line-height:1.1;min-width:38px}
.mini b{font-size:18px;font-weight:600;display:block}
.mini i{font-style:normal;font-size:11px;color:var(--muted)}
.pl .sub{padding:3px 8px;font-size:13px}
.pl.on .sub{border-color:var(--wood);color:var(--wood)}
.muted{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);margin-top:8px}
textarea#rosterTxt{width:100%;min-height:150px;margin:8px 0}

#log{max-height:340px;overflow-y:auto}
.ev{display:grid;grid-template-columns:58px 1fr auto 22px;gap:8px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:14px}
.ev:hover{background:var(--panel2)}
.ev .tm{color:var(--muted);font-size:16px}
.ev .made{color:var(--made)} .ev .miss,.ev .bad{color:var(--miss)} .ev .neutral{color:var(--info)}
.ev .del{border:0;background:none;padding:0;color:var(--muted);font-size:16px}

.box{margin-top:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:16px;font-weight:600;color:var(--muted)}
th.l,td.l{text-align:left}
th.min{color:var(--wood)}
td.min{color:var(--wood);font-weight:600}
td b{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--wood);margin-right:6px}
tfoot td{border-top:2px solid var(--line);font-weight:600}

.ord{display:grid;grid-template-columns:28px 1fr auto auto auto;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line)}
.ord .num{font-size:22px;color:var(--wood);text-align:right}
.ord .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord button{padding:2px 9px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog textarea{width:100%;height:220px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
dialog .segpick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
dialog .segpick button{padding:3px 10px;font-size:13px}
dialog .segpick button.on{background:var(--wood);border-color:var(--wood);color:#1d1608}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="l">
      <h1 id="t_appTitle"></h1>
      <input id="opp" size="14">
      <input id="date" type="date">
    </div>
    <div class="r">
      <div class="langsw" id="langsw"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div>
      <button class="primary" id="pickVideo"></button>
      <button id="csvBtn"></button>
      <button id="rptBtn"></button>
      <button id="jsonBtn"></button>
      <button id="impBtn"></button>
      <button id="newBtn"></button>
      <input type="file" id="vfile" accept="video/*" multiple hidden>
      <input type="file" id="jfile" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="grid">
    <section class="stage">
      <div class="srcsw" id="srcsw"><button data-src="local"></button><button data-src="youtube"></button></div>
      <div class="plform" id="plform" hidden>
        <input id="plInput" placeholder="Playlist ID or URL">
        <button class="primary" id="plLoad"></button>
      </div>
      <div class="vwrap">
        <video id="v" controls playsinline></video>
        <div id="ytwrap" hidden></div>
        <div class="vempty" id="vempty"><div id="vemptyMsg"></div></div>
      </div>

      <div class="vtools"><button id="theaterBtn"></button><button id="popBtn"></button><button id="chapBtn"></button></div>
      <div class="segs" id="segs"></div>

      <div class="bar">
        <div class="buf" aria-live="polite"><small id="t_jerseyLabel"></small><span class="big" id="buf">–</span><span class="bufname" id="bufName"></span></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="badges">
          <span class="court ok" id="courtBadge" hidden></span>
          <span class="badge" id="stopBadge" hidden></span>
          <span class="badge end" id="endBadge" hidden></span>
          <label class="delay"><span id="t_delayLabel"></span><select id="delayIn"></select></label>
          <span class="speed" id="speed"></span>
        </div>
      </div>

      <div class="keys" id="keys"></div>
      <p class="help" id="t_help"></p>
    </section>

    <aside class="side">
      <section class="card">
        <h2><span id="t_rosterTitle"></span><span class="muted" id="onCount"></span></h2>
        <div id="roster"></div>
        <details id="rosterDetails">
          <summary id="t_editRoster"></summary>
          <textarea id="rosterTxt"></textarea>
          <button id="applyRoster" class="primary"></button> <button id="resetRoster"></button>
        </details>
      </section>
      <section class="card">
        <h2><span id="t_eventLog"></span><span class="muted" id="logCount"></span><button id="subOnly" style="padding:2px 10px"></button></h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>

  <section class="card box">
    <h2><span>Box score</span><span class="muted" id="boxNote"></span></h2>
    <table>
      <thead><tr>
        <th class="l" id="t_playerCol"></th><th class="min">MIN</th><th>PTS</th><th>2PT</th><th>3PT</th><th>FT</th>
        <th>REB</th><th>AST</th><th>STL</th><th>TO</th>
      </tr></thead>
      <tbody id="boxBody"></tbody>
      <tfoot id="boxFoot"></tfoot>
    </table>
  </section>
</div>

<dialog id="askDlg">
  <p id="askMsg"></p>
  <div class="row"><button id="askNo"></button><button id="askOk" class="primary"></button></div>
</dialog>
<dialog id="ordDlg">
  <h3 style="margin:0 0 4px" id="t_ordTitle"></h3>
  <p class="muted" style="margin:0 0 10px" id="t_ordHint"></p>
  <div class="row" style="justify-content:flex-start;margin:0 0 8px"><button id="ordTime"></button><button id="ordName"></button></div>
  <div id="ordList"></div>
  <div class="row"><button id="ordNo"></button><button id="ordOk" class="primary"></button></div>
</dialog>
<dialog id="expDlg">
  <p id="expMsg" class="muted"></p>
  <textarea id="expTxt" readonly></textarea>
  <div class="row"><button id="expCopy"></button><button id="expClose" class="primary"></button></div>
</dialog>
<dialog id="chapDlg">
  <h3 style="margin:0 0 4px" id="t_chapTitle"></h3>
  <p class="muted" style="margin:0 0 10px" id="t_chapHint"></p>
  <div class="segpick" id="chapSegs"></div>
  <div class="chapbox" id="chapBox"></div>
  <p class="muted" id="chapNote" style="margin:8px 0 0"></p>
  <div class="row"><button id="chapCopy"></button><button id="chapDone" class="primary"></button></div>
</dialog>

<script src="https://www.youtube.com/iframe_api"></script>

/* ---------- stats ---------- */
const subsOf = n => S.events.filter(e => e.player === n && (e.type === 'SUB_IN' || e.type === 'SUB_OUT')).sort((a,b) => a.t - b.t);

function tag(type, forced) {

  if (!src) { toast(t('needJersey'), 'warn'); return; }
  const n = parseInt(src, 10);
  if (!S.roster.some(p => p.number === n)) { toast(t('notInRoster', n), 'warn'); setBuf(''); return; }
  const tm = stamp(), who = '#' + n + ' ' + nameOf(n);
  let lateTxt = '';

    if (onCourtAt(n, tm)) { toast(t('alreadyOn', who), 'warn'); setBuf(''); return; }
    const nowOn = courtAt(tm);
    if (nowOn.size >= 5) {
      const on = [...nowOn].sort((a, b) => a - b).map(x => '#' + x).join(' ');
      toast(t('courtFull', on), 'warn'); setBuf(''); return;
    }
    const over = overflowFrom(S.events.concat([{ t: tm, player: n, type }]), tm);
    if (over != null && over > tm + 0.001) lateTxt = t('laterOver', fmtPos(over));
  } else if (type === 'SUB_OUT') {
    if (!onCourtAt(n, tm)) { toast(t('alreadyOff', who), 'warn'); setBuf(''); return; }
  } else if (!onCourtAt(n, tm)) {
    toast(t('offCourtBlock', who), 'warn'); setBuf(''); return;
  }
  S.events.push({ t: isSub({ type }) ? tm : statStamp(), player: n, type });
  save(); setBuf('');
  renderAll();
  const c = courtAt(tm).size;
  const warn = (c < 5 ? t('under5', c) : c > 5 ? t('moreThan5') : '') + lateTxt;
  const label = TYPES[type] ? TYPES[type].label : subLabel(type);

/* ---------- YouTube provider ---------- */
function ensureYT() {
  return new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve();
    const fail = () => { const err = new Error('yt api timeout'); err.code = 'api'; reject(err); };
    if (ytLoading) { const iv = setInterval(() => { if (window.YT && window.YT.Player) { clearInterval(iv); resolve(); } }, 200); setTimeout(() => { clearInterval(iv); if (!(window.YT && window.YT.Player)) fail(); }, 8000); return; }
    ytLoading = true;
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) {} resolve(); };
    setTimeout(() => { if (!(window.YT && window.YT.Player)) fail(); }, 8000);
  });
}
function createYT() {
  return new Promise((resolve, reject) => {
    let settled = false;
    yt = new YT.Player('ytwrap', {
      height: '100%', width: '100%', playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: () => { ytReady = true; settled = true; resolve(); if (ytPendingSeek) { const p = ytPendingSeek; ytPendingSeek = null; loadSegYT(p.i, p.tm, p.play); } },
        onError: e => {
          const names = { 2:'invalid video id', 5:'HTML5 player error', 100:'video not found or private', 101:'embedding disabled by video owner', 150:'embedding disabled by video owner' };
          toast(t('ytPlaybackErr', names[e.data] || ('code ' + e.data)), 'warn');
          if (!settled) { settled = true; const err = new Error('yt error'); err.code = 'video'; reject(err); }
        },
        onStateChange: e => {
          const prevState = ytLastState; ytLastState = e.data;
          if (e.data === YT.PlayerState.PAUSED && prevState === YT.PlayerState.PLAYING) pausePos = yt.getCurrentTime();
          if (e.data === YT.PlayerState.ENDED) { const n = curSeg + 1; if (n < S.game.videos.length) loadSeg(n, 0, true); }
          if (e.data === YT.PlayerState.PLAYING && yt.getPlaybackRate() !== curRate) yt.setPlaybackRate(curRate);
          if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.PAUSED) renderAll();
        }

    });
  });
}
function ytPlaylistIdFrom(raw) {
  const s = (raw || '').trim();
  let m = s.match(/[?&]list=([A-Za-z0-9_-]+)/); if (m) return m[1];
  if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;

}
async function loadPlaylist(rawId) {
  const pid = ytPlaylistIdFrom(rawId);
  if (!pid) { toast(t('plBadId'), 'warn'); return; }
  // A different playlist means a different game: old events/chapters no longer match the video, so confirm before clearing.
  // Re-loading the same playlist (e.g. after a page refresh) keeps everything.
  const hasData = S.events.length || S.clock_stopped.length || S.stopStart != null || S.endT != null;
  const needClear = !!hasData && S.game.playlistId !== pid;
  if (needClear && !(await ask(t('confirmNewPlaylist', S.events.length), t('clear')))) return;
  toast(t('plLoading'), 'neutral');
  try {
    await ensureYT();
  } catch (e) { toast(t('ytApiFail'), 'warn'); return; }
  try {
    if (!yt) { $('#ytwrap').hidden = false; await createYT(); }
    yt.cuePlaylist({ listType: 'playlist', list: pid });
    const ids = await new Promise((resolve, reject) => {
      let tries = 0;
      const iv = setInterval(() => {
        tries++;
        const list = yt.getPlaylist();
        if (list && list.length) { clearInterval(iv); resolve(list); }
        else if (tries > 40) { clearInterval(iv); const err = new Error('empty'); err.code = 'access'; reject(err); }
      }, 250);
    });
    if (!ids.length) { toast(t('plEmpty'), 'warn'); return; }
    if (needClear) { S.events = []; S.clock_stopped = []; S.stopStart = null; S.endT = null; }
    S.game.playlistId = pid;
    S.game.videos = ids.map(id => ({ videoId: id, duration: null }));
    save();
    await preloadYTDurations();
    curSeg = 0; loadSegYT(0, 0, false);
    renderAll(); loadVideoUI();
    { const miss = missingDur(); if (miss.length) toast(t('durMissing', miss.map(i => i + 1).join(', ')), 'warn'); else toast(t('plLoaded', S.game.videos.length), 'made'); }
  } catch (e) { toast(t('plNoAccess'), 'warn'); }
}
function ytDurationOf(wantId, timeoutMs) {
  return new Promise(resolve => {
    let done = false;
    const finish = d => { if (done) return; done = true; clearInterval(iv); yt.removeEventListener('onStateChange', check); resolve(d); };
    const check = () => {
      if (done) return;
      const data = yt.getVideoData ? yt.getVideoData() : null;
      if (!data || data.video_id !== wantId) return;
      const d = yt.getDuration();
      if (d > 0) finish(d);
    };
    yt.addEventListener('onStateChange', check);
    const iv = setInterval(check, 200);
    yt.cueVideoById({ videoId: wantId });
    setTimeout(() => finish(0), timeoutMs);
  });
}

  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  toast(t('loadingClips', files.length), 'neutral');
  const known = [], fresh = [];
  for (const f of files) {
    const d = await readDuration(f);
    if (!isFinite(d)) { toast(t('cantRead', f.name), 'warn'); continue; }
    (S.game.videos.some(x => x.name === f.name) ? known : fresh).push({ f, d });
  }
  if (!S.events.length) { clearRuntime(); S.game.videos = []; fresh.push(...known); known.length = 0; }
  const attach = (it, i) => { if (vids[i]) URL.revokeObjectURL(vids[i].url); vids[i] = { file: it.f, url: URL.createObjectURL(it.f) }; };
  for (const it of known) {
    const i = S.game.videos.findIndex(x => x.name === it.f.name);
    if (S.game.videos[i].duration == null) S.game.videos[i].duration = it.d;
    attach(it, i);
  }
  let ordered = [];
  if (fresh.length) {
    ordered = await chooseOrder(fresh);
    if (!ordered) { ordered = []; toast(t('cancelledNoAdd'), 'warn'); }
  }
  for (const it of ordered) { const i = S.game.videos.length; S.game.videos.push({ name: it.f.name, duration: it.d }); attach(it, i); }
  save();
  if (!v.getAttribute('src')) { const first = S.game.videos.findIndex((x, i) => vids[i]); if (first >= 0) loadSeg(first, 0, false); }
  renderAll(); loadVideoUI();
  if (ordered.length || known.length) toast(t('totalClips', S.game.videos.length), 'made');
};
async function reorderVideos() {
  if (S.events.length) { toast(t('orderLocked'), 'warn'); return; }
  const items = S.game.videos.map((x, i) => vids[i] ? { f: vids[i].file, d: x.duration } : null);
  if (!items.length || items.some(x => !x)) { toast(t('pickAllFirst'), 'warn'); return; }
  const ord = await chooseOrder(items, true); if (!ord) return;
  const keep = vids.slice();
  S.game.videos = ord.map(it => ({ name: it.f.name, duration: it.d }));
  vids.length = 0; ord.forEach((it, i) => { vids[i] = keep.find(o => o && o.file === it.f); });
  curSeg = 0; v.removeAttribute('src'); save();
  loadSeg(0, 0, false); renderAll(); loadVideoUI(); toast(t('orderUpdated'), 'made');
}
$('#segs').onclick = e => {
  if (e.target.closest('[data-retrydur]')) { retryDurations(); return; }
  if (e.target.closest('[data-reorder]')) { reorderVideos(); return; }
  const b = e.target.closest('[data-seg]');
  if (b) { b.blur(); loadSeg(+b.dataset.seg, 0, false); return; }
  if (e.target.closest('[data-resetv]')) resetVideos();
};
v.addEventListener('pause', () => { pausePos = v.currentTime; });
v.addEventListener('ended', () => { const n = curSeg + 1; if (n < S.game.videos.length && vids[n]) loadSeg(n, 0, true); });
$('#opp').oninput = e => { S.game.opponent = e.target.value; save(); };
$('#date').oninput = e => { S.game.date = e.target.value; save(); };

const dsel = $('#delayIn');
dsel.innerHTML = Array.from({ length: 11 }, (_, i) => `<option value="${i}">${i}</option>`).join('');
dsel.value = String(tagDelay);
dsel.addEventListener('change', () => { tagDelay = parseInt(dsel.value, 10) || 0; try { localStorage.setItem('hoops-tagger-delay', String(tagDelay)); } catch (e) {} dsel.blur(); });
const sp = $('#speed');
sp.innerHTML = [0.5, 1, 1.5, 2].map(r => `<button data-r="${r}" class="${r===1?'on':''}">${r}x</button>`).join(' ');
sp.onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; curRate = +b.dataset.r; v.playbackRate = v.defaultPlaybackRate = curRate; if (yt && ytReady) yt.setPlaybackRate(curRate); sp.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); b.blur(); };

$('#keys').onclick = e => {

$('#roster').addEventListener('pointerdown', e => {

$('#log').onclick = e => {

$('#applyRoster').onclick = () => {

  if (!r.length) { toast(t('emptyRosterWarn'), 'warn'); return; }
  S.roster = r.sort((a,b) => a.number - b.number); save(); renderAll(); toast(t('rosterApplied', r.length), 'made');

};
$('#resetRoster').onclick = async () => {

$('#csvBtn').onclick = () => exportFile(baseName() + '_boxscore.csv', csvText());
$('#rptBtn').onclick = () => exportFile(baseName() + '_report.html', reportHtml());
$('#jsonBtn').onclick = () => exportFile(baseName() + '_raw.json', JSON.stringify({ app:'game-tagger', version:1, ...S }, null, 2));
$('#impBtn').onclick = () => $('#jfile').click();
$('#jfile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.events) || !Array.isArray(d.roster)) throw new Error('bad');
      if (S.events.length && !(await ask(t('confirmClearEvents', S.events.length), t('replace')))) return;
      S = Object.assign(blank(), d); delete S.app; delete S.version; normalize(); if (!S.roster.length) applyDefaultRoster(); clearRuntime(); resetYT(); save(); syncRosterTxt(); renderSrcSw(); renderAll(); loadVideoUI();
      toast(t('loaded'), 'made');
    } catch (err) { toast(t('badJson'), 'warn'); }
  };
  rd.readAsText(f);
};
$('#newBtn').onclick = async () => {
  if (!(await ask(t('confirmNewGame'), t('clear')))) return;
  resetVideos(); resetYT(); pausePos = null; S.events = []; S.clock_stopped = []; S.stopStart = null; S.endT = null; S.game = { opponent:'', date:today(), source:S.game.source, playlistId:'', videos:[] };
  save(); renderSrcSw(); renderAll(); loadVideoUI(); toast(t('newGameDone'), 'neutral');
};
$('#expClose').onclick = () => $('#expDlg').close();
$('#expCopy').onclick = () => { $('#expTxt').select(); try { document.execCommand('copy'); } catch (e) {} };

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (document.querySelector('dialog[open]')) return;
  const eat = () => { e.preventDefault(); e.stopPropagation(); };
  const k = e.key;
  if (/^[0-9]$/.test(k)) { eat(); setBuf(buf.length >= 2 ? k : buf + k); return; }
  if (k === ' ') { eat(); if (isYT()) { if (yt && ytReady) { yt.getPlayerState() === YT.PlayerState.PLAYING ? yt.pauseVideo() : yt.playVideo(); } } else { v.paused ? v.play() : v.pause(); } return; }
  if (k === 'ArrowLeft') { eat(); seek(curT() - 5); return; }
  if (k === 'ArrowRight') { eat(); seek(curT() + 5); return; }
  if (k === 'Escape') { setBuf(''); return; }
  const K = k.length === 1 ? k.toUpperCase() : k;
  if (KEYMAP[K]) { eat(); tag(KEYMAP[K]); }
  else if (K === 'I') { eat(); tag('SUB_IN'); }
  else if (K === 'O') { eat(); tag('SUB_OUT'); }
  else if (K === 'P') { eat(); toggleStop(); }
  else if (K === 'Z') { eat(); undo(); }
  else if (K === 'E') { eat(); toggleEnd(); }
}
function onKeyUp(e) {
  if (e.key === ' ' && !(e.target.closest && e.target.closest('input,textarea')) && !document.querySelector('dialog[open]')) { e.preventDefault(); e.stopPropagation(); }
}
document.addEventListener('keydown', onKey, true);
document.addEventListener('keyup', onKeyUp, true);
v.addEventListener('pointerup', () => setTimeout(() => { if (v.ownerDocument.activeElement === v) v.blur(); }, 0));

/* ---------- detach player / theater ---------- */
const vwrap = document.querySelector('.vwrap');
function moveVideo(parent, before) {
  const t0 = v.currentTime, was = !v.paused, rate = v.playbackRate;
  parent.insertBefore(v, before || null);
  if (Math.abs(v.currentTime - t0) > 1) v.currentTime = t0;
  v.playbackRate = rate;
  if (was && v.paused) v.play().catch(() => {});
}
async function popOut() {
  if (pipWin) { pipWin.close(); return; }
  if (!v.getAttribute('src')) { toast(t('loadFirst'), 'warn'); return; }
  if ('documentPictureInPicture' in window) {
    try {
      const w = Math.min(1280, Math.round(screen.availWidth * 0.9)), h = Math.round(w * 9 / 16);
      const win = await window.documentPictureInPicture.requestWindow({ width: w, height: h });
      pipWin = win;
      const st = win.document.createElement('style');
      st.textContent = 'html,body{margin:0;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;display:block;background:#000;object-fit:contain}';
      win.document.head.append(st);
      moveVideo(win.document.body);
      win.document.addEventListener('keydown', onKey, true);
      win.document.addEventListener('keyup', onKeyUp, true);
      win.addEventListener('pagehide', () => {
        pipWin = null; moveVideo(vwrap, $('#vempty'));
        $('#popBtn').textContent = t('detach'); loadVideoUI();
      });
      $('#popBtn').textContent = t('retract'); loadVideoUI();
      toast(t('detachedHint'), 'made');
      return;
    } catch (e) { pipWin = null; }
  }
  if (document.pictureInPictureEnabled && v.requestPictureInPicture) {
    try { await v.requestPictureInPicture(); toast(t('pipHint'), 'neutral'); return; } catch (e) {}
  }
  toast(t('noDetach'), 'warn');
}
$('#popBtn').onclick = e => { e.target.blur(); popOut(); };
$('#theaterBtn').onclick = e => {
  const on = document.body.classList.toggle('theater');
  e.target.textContent = on ? t('shrink') : t('enlarge'); e.target.blur();
};

/* ---------- YouTube chapter export ---------- */
const YT_MIN_GAP = 10;
const fmtYT = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), r = sec % 60; return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0') : m + ':' + String(r).padStart(2, '0'); };
function chapterLine(e) {
  const label = TYPES[e.type] ? TYPES[e.type].label : (e.type === 'SUB_IN' ? t('inWord') : t('outWord'));
  return '#' + e.player + ' ' + nameOf(e.player) + ' ' + label;
}
function buildChapters(segIndex) {
  const n = S.game.videos.length, segStart = segOff(segIndex), segLen = dur(segIndex);
  const segEnd = segIndex < n - 1 ? segStart + segLen : Infinity;
  const evs = S.events.filter(e => e.t >= segStart && e.t < segEnd).sort((a, b) => a.t - b.t);
  if (!evs.length) return null;
  const lines = [];
  for (const e of evs) {
    const localT = Math.max(0, Math.floor(e.t - segStart)), line = chapterLine(e);
    const last = lines[lines.length - 1];
    if (last && localT - last.t < YT_MIN_GAP) last.items.push(line);
    else lines.push({ t: localT, items: [line] });
  }
  // YouTube rules: first chapter at 0:00, every chapter at least 10s long
  if (lines[0].t < YT_MIN_GAP) { lines[0].t = 0; lines[0].items.unshift(t('chapStart')); }
  else lines.unshift({ t: 0, items: [t('chapStart')] });
  while (lines.length > 1 && segLen && segLen - lines[lines.length - 1].t < YT_MIN_GAP) {
    const last = lines.pop(); lines[lines.length - 1].items.push(...last.items);
  }
  return { text: lines.map(l => fmtYT(l.t) + ' ' + l.items.join(', ')).join('\n'), count: lines.length };
}
function renderChapDlg() {
  const n = S.game.videos.length;
  setHTML($('#chapSegs'), n > 1 ? S.game.videos.map((x, i) => `<button data-cseg="${i}" class="${i === chapSel ? 'on' : ''}">${t('segLabel', i + 1)}</button>`).join('') : '');
  const r = buildChapters(chapSel);
  $('#chapBox').textContent = r ? r.text : t('chapNoEvents');
  $('#chapBox').dataset.empty = r ? '' : '1';
  $('#chapNote').textContent = r && r.count < 3 ? t('chapMin3', r.count) : '';
}
let chapSel = 0;
$('#chapBtn').onclick = () => {
  if (!S.game.videos.length) { toast(t('loadFirst'), 'warn'); return; }
  chapSel = Math.min(curSeg, S.game.videos.length - 1);
  renderChapDlg(); $('#chapDlg').showModal();
};
$('#chapSegs').onclick = e => { const b = e.target.closest('[data-cseg]'); if (!b) return; chapSel = +b.dataset.cseg; renderChapDlg(); };
$('#chapCopy').onclick = async () => {
  const box = $('#chapBox'); if (box.dataset.empty) return;
  let ok = false;
  try { await navigator.clipboard.writeText(box.textContent); ok = true; } catch (e) {}
  if (!ok) {
    const r = document.createRange(); r.selectNodeContents(box);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { ok = document.execCommand('copy'); } catch (e) {}
    sel.removeAllRanges();
  }
  if (ok) { const b = $('#chapCopy'); b.textContent = t('chapCopied'); setTimeout(() => { b.textContent = t('copy'); }, 1500); }
};
$('#chapDone').onclick = () => $('#chapDlg').close();

function syncRosterTxt() { $('#rosterTxt').value = S.roster.map(p => p.number + ' ' + p.name).join('\n'); }
v.addEventListener('seeked', () => { renderRoster(); renderBox(); });
setInterval(() => { if (!v.paused) { renderRoster(); renderBox(); } }, 3000);

syncRosterTxt(); applyLang();
if (!S.roster.length) $('#rosterDetails').open = true;
})();
</script>
