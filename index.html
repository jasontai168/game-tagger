<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比賽標記器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18212b; --deep:#111a24; --panel:#212d3a; --panel2:#2a3a4c; --line:#37495e;
  --text:#e8ecf0; --muted:#98a8ba; --wood:#e3a857; --made:#62c08f; --miss:#ea7c6c; --info:#7fb2e0;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Public Sans','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif}
.num,.big,th,.tm,.mini b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
input,textarea{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:100%}
.app{max-width:1400px;margin:0 auto;padding:14px 16px 40px}

.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .l,.top .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top h1{margin:0 8px 0 0;font:600 26px 'Barlow Condensed',sans-serif;letter-spacing:.02em;color:var(--wood)}
.primary{background:var(--wood);border-color:var(--wood);color:#1d1608;font-weight:600}
.primary:hover{border-color:#fff}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.stage{min-width:0}
.vwrap{position:relative;background:var(--deep);border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.vwrap video{width:100%;height:100%;display:block;background:#000}
.vempty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted)}
.vempty.hide{display:none}

.vtools{display:flex;gap:8px;justify-content:flex-end;margin:8px 0 0}
.vtools button{padding:3px 12px;font-size:13px}
.theater .grid{grid-template-columns:1fr}
.theater .vwrap{aspect-ratio:auto;height:min(80vh,56vw)}
.segs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.segs button{padding:3px 10px;font-size:13px}
.segs button.on{background:var(--wood);border-color:var(--wood);color:#1d1608}
.segs button.missing{opacity:.55;border-style:dashed}
.segs small{margin-left:6px;opacity:.75}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
.buf{min-width:150px;display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 14px}
.buf .big{font-size:38px;font-weight:700;line-height:1.1;color:var(--wood)}
.buf small{color:var(--muted)}
.bufname{font-size:18px;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bufname small{font-weight:400;margin-left:6px}
.bufname.on{color:var(--made)} .bufname.off{color:var(--miss)}
.toast{flex:1;min-width:160px;font-weight:500;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
.toast.made{color:var(--made)} .toast.miss,.toast.bad,.toast.warn{color:var(--miss)} .toast.neutral{color:var(--info)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{border-radius:999px;padding:2px 12px;font-weight:600;background:var(--miss);color:#2a0d08}
.court{border-radius:999px;padding:2px 12px;font-weight:600}
.court.ok{border:1px solid var(--made);color:var(--made)}
.court.bad{background:var(--miss);color:#2a0d08}
.badge.end{background:var(--info);color:#0b2136}
.speed button{padding:3px 9px}
.speed button.on{background:var(--wood);border-color:var(--wood);color:#1d1608}

.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.keys button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 10px}
.keys kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:5px;background:var(--deep);border:1px solid var(--line);font:600 14px 'Barlow Condensed',sans-serif}
.keys .made{border-left:4px solid var(--made)} .keys .miss{border-left:4px solid var(--miss)}
.keys .neutral{border-left:4px solid var(--info)} .keys .bad{border-left:4px solid var(--miss)}
.keys .ctl{border-left:4px solid var(--line)}
.help{color:var(--muted);font-size:13px;margin:10px 0 0}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.pl{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:8px;align-items:center;padding:5px 8px;border-left:3px solid transparent;border-radius:4px;cursor:pointer}
.pl:hover{background:var(--panel2)}
.pl.on{border-left-color:var(--wood);background:var(--panel2)}
.pl.sel{outline:2px solid var(--wood)}
.pl .num{font-size:24px;font-weight:600;color:var(--wood);text-align:right}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{text-align:right;line-height:1.1;min-width:38px}
.mini b{font-size:18px;font-weight:600;display:block}
.mini i{font-style:normal;font-size:11px;color:var(--muted)}
.pl .sub{padding:3px 8px;font-size:13px}
.pl.on .sub{border-color:var(--wood);color:var(--wood)}
.muted{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);margin-top:8px}
textarea#rosterTxt{width:100%;min-height:150px;margin:8px 0}

#log{max-height:340px;overflow-y:auto}
.ev{display:grid;grid-template-columns:58px 1fr auto 22px;gap:8px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:14px}
.ev:hover{background:var(--panel2)}
.ev .tm{color:var(--muted);font-size:16px}
.ev .made{color:var(--made)} .ev .miss,.ev .bad{color:var(--miss)} .ev .neutral{color:var(--info)}
.ev .del{border:0;background:none;padding:0;color:var(--muted);font-size:16px}

.box{margin-top:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:16px;font-weight:600;color:var(--muted)}
th.l,td.l{text-align:left}
th.min{color:var(--wood)}
td.min{color:var(--wood);font-weight:600}
td b{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--wood);margin-right:6px}
tfoot td{border-top:2px solid var(--line);font-weight:600}

.ord{display:grid;grid-template-columns:28px 1fr auto auto auto;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line)}
.ord .num{font-size:22px;color:var(--wood);text-align:right}
.ord .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord button{padding:2px 9px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog textarea{width:100%;height:220px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="l">
      <h1>比賽標記器</h1>
      <input id="opp" placeholder="對手" size="14" aria-label="對手">
      <input id="date" type="date" aria-label="日期">
    </div>
    <div class="r">
      <button class="primary" id="pickVideo">選擇影片(可多選)</button>
      <button id="csvBtn">存 CSV</button>
      <button id="rptBtn">家長報告</button>
      <button id="jsonBtn">存 JSON</button>
      <button id="impBtn">載入 JSON</button>
      <button id="newBtn">新比賽</button>
      <input type="file" id="vfile" accept="video/*" multiple hidden>
      <input type="file" id="jfile" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="grid">
    <section class="stage">
      <div class="vwrap">
        <video id="v" controls playsinline></video>
        <div class="vempty" id="vempty"><div id="vemptyMsg">選擇比賽影片開始標記</div></div>
      </div>

      <div class="vtools"><button id="theaterBtn">放大影片</button><button id="popBtn">分離播放器</button></div>
      <div class="segs" id="segs"></div>

      <div class="bar">
        <div class="buf" aria-live="polite"><small>背號</small><span class="big" id="buf">–</span><span class="bufname" id="bufName"></span></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="badges">
          <span class="court ok" id="courtBadge" hidden></span>
          <span class="badge" id="stopBadge" hidden></span>
          <span class="badge end" id="endBadge" hidden></span>
          <span class="speed" id="speed"></span>
        </div>
      </div>

      <div class="keys" id="keys"></div>
      <p class="help">先打背號(1–2 位數),再按事件鍵。只有在場上的球員才能記錄事件,場上必須剛好 5 人。點右邊名單也可以選球員。影片放在暫停或播放都行,時間點以按下事件鍵的瞬間為準。</p>
    </section>

    <aside class="side">
      <section class="card">
        <h2><span>球員名單</span><span class="muted" id="onCount"></span></h2>
        <div id="roster"></div>
        <details id="rosterDetails">
          <summary>編輯名單</summary>
          <textarea id="rosterTxt" placeholder="每行一位:背號 名字&#10;7 Jason&#10;12 Tim&#10;23 Leo"></textarea>
          <button id="applyRoster" class="primary">套用名單</button>
        </details>
      </section>
      <section class="card">
        <h2><span>事件紀錄 <span class="muted" id="logCount"></span></span><button id="subOnly" style="padding:2px 10px">只看換人</button></h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>

  <section class="card box">
    <h2><span>Box score</span><span class="muted" id="boxNote"></span></h2>
    <table>
      <thead><tr>
        <th class="l">球員</th><th class="min">MIN</th><th>PTS</th><th>2PT</th><th>3PT</th><th>FT</th>
        <th>REB</th><th>AST</th><th>STL</th><th>TO</th>
      </tr></thead>
      <tbody id="boxBody"></tbody>
      <tfoot id="boxFoot"></tfoot>
    </table>
  </section>
</div>

<dialog id="askDlg">
  <p id="askMsg"></p>
  <div class="row"><button id="askNo">取消</button><button id="askOk" class="primary">確定</button></div>
</dialog>
<dialog id="ordDlg">
  <h3 style="margin:0 0 4px">確認影片順序</h3>
  <p class="muted" style="margin:0 0 10px">第 1 段要是最早的。時間是檔案修改時間,可能和實際錄影時間有落差,不確定就用 ↑ ↓ 調整。</p>
  <div class="row" style="justify-content:flex-start;margin:0 0 8px"><button id="ordTime">按檔案時間</button><button id="ordName">按檔名</button></div>
  <div id="ordList"></div>
  <div class="row"><button id="ordNo">取消</button><button id="ordOk" class="primary">確認順序</button></div>
</dialog>
<dialog id="expDlg">
  <p id="expMsg" class="muted"></p>
  <textarea id="expTxt" readonly></textarea>
  <div class="row"><button id="expCopy">複製</button><button id="expClose" class="primary">關閉</button></div>
</dialog>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE = 'hoops-tagger-v1';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const blank = () => ({ game:{ opponent:'', date:today(), videos:[] }, roster:[], events:[], clock_stopped:[], stopStart:null, endT:null });

let S = blank();
try {
  const raw = localStorage.getItem(STORE);
  if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.events) && Array.isArray(p.roster)) S = Object.assign(blank(), p); }
} catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
function normalize() {
  if (!S.game) S.game = { opponent:'', date:today() };
  if (!Array.isArray(S.game.videos)) S.game.videos = S.game.video ? [{ name:S.game.video, duration:null }] : [];
  delete S.game.video;
}
normalize();

const TYPES = {
  '2PT_made':{k:'A',label:'2PT made',cls:'made'}, '2PT_miss':{k:'S',label:'2PT miss',cls:'miss'},
  '3PT_made':{k:'D',label:'3PT made',cls:'made'}, '3PT_miss':{k:'F',label:'3PT miss',cls:'miss'},
  'FT_made':{k:'G',label:'FT made',cls:'made'},   'FT_miss':{k:'H',label:'FT miss',cls:'miss'},
  'REB':{k:'R',label:'REB',cls:'neutral'}, 'AST':{k:'T',label:'AST',cls:'neutral'},
  'STL':{k:'Y',label:'STL',cls:'neutral'}, 'TO':{k:'U',label:'TO',cls:'bad'},
  'SUB_IN':{label:'上場',cls:'neutral'}, 'SUB_OUT':{label:'下場',cls:'neutral'}
};
const KEYMAP = {};
for (const [t, o] of Object.entries(TYPES)) if (o.k) KEYMAP[o.k] = t;

const v = $('#v');
const vids = []; let curSeg = 0; let pipWin = null;
const dur = i => (S.game.videos[i] && S.game.videos[i].duration) || 0;
const segOff = i => { let o = 0; for (let k = 0; k < i; k++) o += dur(k); return o; };
const curT = () => segOff(curSeg) + (v.currentTime || 0);
function locate(g) {
  const n = S.game.videos.length; let o = 0;
  for (let i = 0; i < n; i++) { const d = dur(i); if (g < o + d || i === n - 1) return { i, t: Math.max(0, g - o) }; o += d; }
  return { i: 0, t: Math.max(0, g) };
}
const fmtPos = g => { if (S.game.videos.length > 1) { const p = locate(g); return '第' + (p.i + 1) + '段 ' + fmt(p.t); } return fmt(g); };
const fmtLog = g => { if (S.game.videos.length > 1) { const p = locate(g); return (p.i + 1) + '·' + fmt(p.t); } return fmt(g); };
const stamp = () => Math.floor(curT() * 100) / 100;
const nameOf = n => (S.roster.find(p => p.number === n) || {}).name || '';
const fmt = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); };
const setHTML = (el, html) => { if (el._h !== html) { el.innerHTML = html; el._h = html; } };

/* ---------- toast + buffer ---------- */
let tt;
function toast(msg, cls) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (cls || '');
  clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', 2400);
}
let buf = '', bufTimer;
function setBuf(s, ms) {
  buf = s; $('#buf').textContent = s || '–';
  const bn = $('#bufName');
  if (!s) { bn.textContent = ''; bn.className = 'bufname'; }
  else {
    const n = parseInt(s, 10), p = S.roster.find(x => x.number === n);
    if (!p) { bn.className = 'bufname off'; bn.textContent = '不在名單'; }
    else { const on = onCourtAt(n, stamp()); bn.className = 'bufname ' + (on ? 'on' : 'off'); bn.innerHTML = esc(p.name || '(未命名)') + '<small>' + (on ? '場上' : '場下') + '</small>'; }
  }
  clearTimeout(bufTimer);
  if (s) bufTimer = setTimeout(() => setBuf(''), ms || 2500);
  renderRoster();
}

/* ---------- stats ---------- */
const subsOf = n => S.events.filter(e => e.player === n && (e.type === 'SUB_IN' || e.type === 'SUB_OUT')).sort((a,b) => a.t - b.t);
function onCourtAt(n, t) { let on = false; for (const e of subsOf(n)) if (e.t <= t + 0.001) on = e.type === 'SUB_IN'; return on; }
const isSub = e => e.type === 'SUB_IN' || e.type === 'SUB_OUT';
function courtAt(t) {
  const out = new Set(), ps = new Set(S.events.filter(isSub).map(e => e.player));
  for (const n of ps) if (onCourtAt(n, t)) out.add(n);
  return out;
}
function maxCourtFrom(events, t) {
  const subs = events.filter(isSub).sort((a, b) => (a.t - b.t) || ((a.type === 'SUB_OUT' ? 0 : 1) - (b.type === 'SUB_OUT' ? 0 : 1)));
  const on = new Set(); let max = 0, started = false;
  for (const e of subs) {
    if (!started && e.t > t + 0.001) { max = on.size; started = true; }
    if (e.type === 'SUB_IN') on.add(e.player); else on.delete(e.player);
    if (started) max = Math.max(max, on.size);
  }
  return started ? max : on.size;
}
const endTime = () => S.endT != null ? S.endT : Math.max(curT(), ...S.events.map(e => e.t), 0);
function mergedStops(end) {
  const segs = S.clock_stopped.map(s => [s.start, s.end]);
  if (S.stopStart != null) segs.push([S.stopStart, Math.max(end, S.stopStart)]);
  segs.sort((a,b) => a[0] - b[0]);
  const out = [];
  for (const s of segs) { const last = out[out.length-1]; if (last && s[0] <= last[1]) last[1] = Math.max(last[1], s[1]); else out.push([s[0], s[1]]); }
  return out;
}
const overlap = (a, b, stops) => { let o = 0; for (const [s,e] of stops) { const x = Math.max(a,s), y = Math.min(b,e); if (y > x) o += y - x; } return o; };
function secondsOn(n, end, stops) {
  let inT = null, total = 0;
  const add = (a, b) => { if (b > a) total += (b - a) - overlap(a, b, stops); };
  for (const e of subsOf(n)) {
    if (e.type === 'SUB_IN') { if (inT == null) inT = e.t; }
    else if (inT != null) { add(inT, e.t); inT = null; }
  }
  if (inT != null) add(inT, Math.max(end, inT));
  return total;
}
function computeStats() {
  const end = endTime(), stops = mergedStops(end), map = new Map();
  const get = n => { if (!map.has(n)) map.set(n, {n, name:nameOf(n), sec:0, m2:0,a2:0,m3:0,a3:0,mf:0,af:0, reb:0,ast:0,stl:0,to:0, pts:0}); return map.get(n); };
  S.roster.forEach(p => get(p.number));
  for (const e of S.events) {
    const r = get(e.player);
    switch (e.type) {
      case '2PT_made': r.m2++; r.a2++; break; case '2PT_miss': r.a2++; break;
      case '3PT_made': r.m3++; r.a3++; break; case '3PT_miss': r.a3++; break;
      case 'FT_made': r.mf++; r.af++; break; case 'FT_miss': r.af++; break;
      case 'REB': r.reb++; break; case 'AST': r.ast++; break; case 'STL': r.stl++; break; case 'TO': r.to++; break;
    }
  }
  for (const r of map.values()) { r.pts = 2*r.m2 + 3*r.m3 + r.mf; r.sec = secondsOn(r.n, end, stops); }
  return [...map.values()].sort((a,b) => a.n - b.n);
}

/* ---------- actions ---------- */
function tag(type, forced) {
  const src = forced != null ? String(forced) : buf;
  if (!src) { toast('先輸入背號', 'warn'); return; }
  const n = parseInt(src, 10);
  if (!S.roster.some(p => p.number === n)) { toast('#' + n + ' 不在名單裡', 'warn'); setBuf(''); return; }
  const t = stamp(), who = '#' + n + ' ' + nameOf(n);
  if (type === 'SUB_IN') {
    if (onCourtAt(n, t)) { toast(who + ' 已經在場上', 'warn'); setBuf(''); return; }
    if (maxCourtFrom(S.events.concat([{ t, player: n, type }]), t) > 5) {
      const on = [...courtAt(t)].sort((a, b) => a - b).map(x => '#' + x).join(' ');
      toast('場上已經有 5 人(' + on + '),請先讓一位下場', 'warn'); setBuf(''); return;
    }
  } else if (type === 'SUB_OUT') {
    if (!onCourtAt(n, t)) { toast(who + ' 本來就在場下', 'warn'); setBuf(''); return; }
  } else if (!onCourtAt(n, t)) {
    toast(who + ' 不在場上,不能記錄。先讓他上場(I + 背號)', 'warn'); setBuf(''); return;
  }
  S.events.push({ t, player: n, type });
  save(); setBuf('');
  renderAll();
  const c = courtAt(t).size;
  const warn = c < 5 ? ' · 場上只有 ' + c + ' 人,記得補滿 5 人' : c > 5 ? ' · 場上超過 5 人' : '';

/* ---------- wiring ---------- */
function parseRoster(txt) {
  const out = [], seen = new Set();
  for (const line of txt.split(/\r?\n/)) {
    const m = line.trim().match(/^#?(\d{1,2})[\s,.\-:、]*(.*)$/); if (!m) continue;
    const n = parseInt(m[1], 10); if (seen.has(n)) continue; seen.add(n);
    out.push({ number: n, name: m[2].trim() });
  }
  return out;
}
function loadVideoUI() {
  if (pipWin) { $('#vempty').classList.remove('hide'); $('#vemptyMsg').textContent = '播放器在獨立視窗裡。按「收回播放器」放回來。'; return; }
  const has = !!v.getAttribute('src'), names = S.game.videos.map(x => x.name);
  $('#vempty').classList.toggle('hide', has);
  $('#vemptyMsg').textContent = names.length && !has ? '資料還在。請重新選擇這些影片(可一次多選):' + names.join('、') : '選擇比賽影片開始標記(這場有幾段,就一次全選)';
}
$('#pickVideo').onclick = () => $('#vfile').click();
function readDuration(f) {
  return new Promise(res => {
    const t = document.createElement('video'), u = URL.createObjectURL(f);
    t.preload = 'metadata';
    t.onloadedmetadata = () => { res(t.duration); URL.revokeObjectURL(u); };
    t.onerror = () => { res(NaN); URL.revokeObjectURL(u); };
    t.src = u;
  });
}
const natCmp = (a, b) => a.f.name.localeCompare(b.f.name, undefined, { numeric: true });
const byTime = (a, b) => (a.f.lastModified - b.f.lastModified) || natCmp(a, b);
function chooseOrder(items, keep) {
  return new Promise(res => {
    const d = $('#ordDlg'); let arr = keep ? items.slice() : items.slice().sort(byTime), done = false;
    const stamp = f => new Date(f.lastModified).toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const draw = () => {
      $('#ordList').innerHTML = arr.map((it, i) => `<div class="ord"><span class="num">${i + 1}</span><span class="nm" title="${esc(it.f.name)}">${esc(it.f.name)}</span>
        <span class="muted">${stamp(it.f)} · ${fmt(it.d)}</span>
        <button data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="上移">↑</button><button data-down="${i}" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="下移">↓</button></div>`).join('');
    };
    const finish = val => { if (done) return; done = true; d.close(); res(val); };
    $('#ordList').onclick = e => {
      const u = e.target.closest('[data-up]'), w = e.target.closest('[data-down]');
      const i = u ? +u.dataset.up : w ? +w.dataset.down : -1; if (i < 0) return;
      const j = u ? i - 1 : i + 1; if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]]; draw();
    };
    $('#ordTime').onclick = () => { arr.sort(byTime); draw(); };
    $('#ordName').onclick = () => { arr.sort(natCmp); draw(); };
    $('#ordOk').onclick = () => finish(arr);
    $('#ordNo').onclick = () => finish(null);
    d.oncancel = () => { done = true; res(null); };
    draw(); d.showModal();
  });
}
$('#vfile').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  toast('讀取 ' + files.length + ' 段影片…', 'neutral');
  const known = [], fresh = [];
  for (const f of files) {
    const d = await readDuration(f);
    if (!isFinite(d)) { toast('無法讀取 ' + f.name, 'warn'); continue; }
    (S.game.videos.some(x => x.name === f.name) ? known : fresh).push({ f, d });
  }
  if (!S.events.length) { clearRuntime(); S.game.videos = []; fresh.push(...known); known.length = 0; }
  const attach = (it, i) => { if (vids[i]) URL.revokeObjectURL(vids[i].url); vids[i] = { file: it.f, url: URL.createObjectURL(it.f) }; };
  for (const it of known) {
    const i = S.game.videos.findIndex(x => x.name === it.f.name);
    if (S.game.videos[i].duration == null) S.game.videos[i].duration = it.d;
    attach(it, i);
  }
  let ordered = [];
  if (fresh.length) {
    ordered = await chooseOrder(fresh);
    if (!ordered) { ordered = []; toast('已取消,沒有加入新影片', 'warn'); }
  }
  for (const it of ordered) { const i = S.game.videos.length; S.game.videos.push({ name: it.f.name, duration: it.d }); attach(it, i); }
  save();
  if (!v.getAttribute('src')) { const first = S.game.videos.findIndex((x, i) => vids[i]); if (first >= 0) loadSeg(first, 0, false); }
  renderAll(); loadVideoUI();
  if (ordered.length || known.length) toast('這場共 ' + S.game.videos.length + ' 段影片', 'made');
};
async function reorderVideos() {

  const items = S.game.videos.map((x, i) => vids[i] ? { f: vids[i].file, d: x.duration } : null);
  if (!items.length || items.some(x => !x)) { toast('請先把所有影片都載入', 'warn'); return; }
  const ord = await chooseOrder(items, true); if (!ord) return;
  const keep = vids.slice();
  S.game.videos = ord.map(it => ({ name: it.f.name, duration: it.d }));
  vids.length = 0; ord.forEach((it, i) => { vids[i] = keep.find(o => o && o.file === it.f); });
  curSeg = 0; v.removeAttribute('src'); save();
  loadSeg(0, 0, false); renderAll(); loadVideoUI(); toast('順序已更新', 'made');
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (document.querySelector('dialog[open]')) return;
  const eat = () => { e.preventDefault(); e.stopPropagation(); };
  const k = e.key;
  if (/^[0-9]$/.test(k)) { eat(); setBuf(buf.length >= 2 ? k : buf + k); return; }
  if (k === ' ') { eat(); v.paused ? v.play() : v.pause(); return; }
  if (k === 'ArrowLeft') { eat(); seek(curT() - 5); return; }
  if (k === 'ArrowRight') { eat(); seek(curT() + 5); return; }
  if (k === 'Escape') { setBuf(''); return; }
  const K = k.length === 1 ? k.toUpperCase() : k;
  if (KEYMAP[K]) { eat(); tag(KEYMAP[K]); }
  else if (K === 'I') { eat(); tag('SUB_IN'); }
  else if (K === 'O') { eat(); tag('SUB_OUT'); }
  else if (K === 'P') { eat(); toggleStop(); }
  else if (K === 'Z') { eat(); undo(); }
  else if (K === 'E') { eat(); toggleEnd(); }
}
function onKeyUp(e) {
  if (e.key === ' ' && !(e.target.closest && e.target.closest('input,textarea')) && !document.querySelector('dialog[open]')) { e.preventDefault(); e.stopPropagation(); }
}
document.addEventListener('keydown', onKey, true);
document.addEventListener('keyup', onKeyUp, true);
v.addEventListener('pointerup', () => setTimeout(() => { if (v.ownerDocument.activeElement === v) v.blur(); }, 0));

/* ---------- detach player / theater ---------- */
const vwrap = document.querySelector('.vwrap');
function moveVideo(toDoc, parent, before) {
  const t = v.currentTime, was = !v.paused, rate = v.playbackRate;
  parent.insertBefore(v, before || null);
  if (Math.abs(v.currentTime - t) > 1) v.currentTime = t;
  v.playbackRate = rate;
  if (was && v.paused) v.play().catch(() => {});
}
async function popOut() {
  if (pipWin) { pipWin.close(); return; }
  if (!v.getAttribute('src')) { toast('先載入影片', 'warn'); return; }
  if ('documentPictureInPicture' in window) {
    try {
      const w = Math.min(1280, Math.round(screen.availWidth * 0.9)), h = Math.round(w * 9 / 16);
      const win = await window.documentPictureInPicture.requestWindow({ width: w, height: h });
      pipWin = win;
      const st = win.document.createElement('style');
      st.textContent = 'html,body{margin:0;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;display:block;background:#000;object-fit:contain}';
      win.document.head.append(st);
      moveVideo(win.document, win.document.body);
      win.document.addEventListener('keydown', onKey, true);
      win.document.addEventListener('keyup', onKeyUp, true);
      win.addEventListener('pagehide', () => {
        pipWin = null; moveVideo(document, vwrap, $('#vempty'));
        $('#popBtn').textContent = '分離播放器'; loadVideoUI();
      });
      $('#popBtn').textContent = '收回播放器'; loadVideoUI();
      toast('已分離。把視窗拖到第二個螢幕,拉角落放大', 'made');
      return;
    } catch (e) { pipWin = null; }
  }
  if (document.pictureInPictureEnabled && v.requestPictureInPicture) {
    try { await v.requestPictureInPicture(); toast('已開啟子母畫面(在小視窗裡快捷鍵無效,標記請回主視窗)', 'neutral'); return; } catch (e) {}
  }
  toast('這個瀏覽器不能分離播放器,可以改用「放大影片」', 'warn');
}
$('#popBtn').onclick = e => { e.target.blur(); popOut(); };
$('#theaterBtn').onclick = e => {
  const on = document.body.classList.toggle('theater');
  e.target.textContent = on ? '縮小影片' : '放大影片'; e.target.blur();
};

function syncRosterTxt() { $('#rosterTxt').value = S.roster.map(p => p.number + ' ' + p.name).join('\n'); }
v.addEventListener('seeked', () => { renderRoster(); renderBox(); });
setInterval(() => { if (!v.paused) { renderRoster(); renderBox(); } }, 3000);

renderKeys(); syncRosterTxt(); renderAll(); loadVideoUI();
if (!S.roster.length) $('#rosterDetails').open = true;
})();
</script>
